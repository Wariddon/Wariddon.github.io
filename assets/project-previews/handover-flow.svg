<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Arial,sans-serif"><rect width="1280" height="800" fill="#16352f"/><path d="M96 268V685" stroke="#88aa98" stroke-width="3"/><text x="70" y="112" font-size="52" fill="#f4eed9">Order handover</text><text x="72" y="173" font-size="30" fill="#b2d5c7">Before an order changes hands</text><circle cx="96" cy="288" r="14" fill="#e3be78"/><rect x="145" y="240" width="1040" height="130" rx="14" fill="#23473e"/><text x="176" y="289" font-size="34" fill="white">Check owner</text><text x="176" y="336" font-size="27" fill="#d1e1d7">Match the current staff assignment.</text><circle cx="96" cy="451" r="14" fill="#e3be78"/><rect x="145" y="403" width="1040" height="130" rx="14" fill="#23473e"/><text x="176" y="452" font-size="34" fill="white">Check status</text><text x="176" y="499" font-size="27" fill="#d1e1d7">Confirm the order is still open.</text><circle cx="96" cy="614" r="14" fill="#e3be78"/><rect x="145" y="566" width="1040" height="130" rx="14" fill="#23473e"/><text x="176" y="615" font-size="34" fill="white">Save together</text><text x="176" y="662" font-size="27" fill="#d1e1d7">Update the queue and the order record.</text></svg>