<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" style="display:block;max-width:100%;height:auto" role="img" aria-labelledby="title description"><title id="title">AML report delivery</title><desc id="description">Separate behavior for reports, empty datasets and delivery errors. High-level workflow illustration based on career history.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#72918e" stroke-width="1.7"/></marker></defs><rect width="1280" height="800" fill="#edf3f0"/><path d="M0 78H1280" stroke="#d2ded9"/><g font-family="Arial,sans-serif"><text x="55" y="49" font-size="20" fill="#14273d" font-weight="700">SCB / EXTEND IT RESOURCE</text><text x="875" y="49" font-size="16" fill="#536374" font-weight="700">WORKFLOW ILLUSTRATION</text><text x="64" y="163" font-size="44" fill="#14273d" font-weight="700">AML report delivery</text><text x="66" y="208" font-size="24" fill="#536374" font-weight="400">Separate behavior for reports, empty datasets and delivery errors.</text><rect x="64" y="291" width="337" height="171" rx="17" fill="white" stroke="#cbd9d6" stroke-width="2"/><text x="88" y="335" font-size="25" fill="#14273d" font-weight="700">Report request</text><text x="88" y="378" font-size="21" fill="#536374" font-weight="400">Spring Boot service</text><text x="88" y="408" font-size="21" fill="#536374" font-weight="400">Monthly AML reporting</text><rect x="471" y="291" width="337" height="171" rx="17" fill="white" stroke="#cbd9d6" stroke-width="2"/><text x="495" y="335" font-size="25" fill="#14273d" font-weight="700">Report files</text><text x="495" y="378" font-size="21" fill="#536374" font-weight="400">Azure Blob Storage</text><text x="495" y="408" font-size="21" fill="#536374" font-weight="400">Available or empty dataset</text><rect x="878" y="291" width="337" height="171" rx="17" fill="white" stroke="#cbd9d6" stroke-width="2"/><text x="902" y="335" font-size="25" fill="#14273d" font-weight="700">Email delivery</text><text x="902" y="378" font-size="21" fill="#536374" font-weight="400">SMTP integration</text><text x="902" y="408" font-size="21" fill="#536374" font-weight="400">Explicit error handling</text><path d="M412 376H456" fill="none" stroke="#72918e" stroke-width="3" marker-end="url(#arrow)"/><path d="M820 376H864" fill="none" stroke="#72918e" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="509" width="337" height="111" rx="13" fill="#dfece6"/><text x="88" y="550" font-size="25" fill="#086f67" font-weight="700">ZIP report</text><text x="88" y="587" font-size="20" fill="#536374" font-weight="400">Attach available reports</text><rect x="471" y="509" width="337" height="111" rx="13" fill="#dfece6"/><text x="495" y="550" font-size="25" fill="#086f67" font-weight="700">No data</text><text x="495" y="587" font-size="20" fill="#536374" font-weight="400">Send a clear notification</text><rect x="878" y="509" width="337" height="111" rx="13" fill="#dfece6"/><text x="902" y="550" font-size="25" fill="#086f67" font-weight="700">Delivery error</text><text x="902" y="587" font-size="20" fill="#536374" font-weight="400">Handle the failure path</text><path d="M64 687H1216" stroke="#ccd9d4"/><text x="66" y="734" font-size="21" fill="#536374" font-weight="400">Illustrates selected contributions to report delivery.</text><text x="66" y="763" font-size="21" fill="#536374" font-weight="400">Service behavior and confirmed email receipt are separate signals.</text></g></svg>